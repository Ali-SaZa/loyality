<!doctype html>
<html lang="en">
  <head>
    <style>
      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .item {
        width: 30px;
        height: 30px;
        background-color: red;
        position: relative;
        animation-name: example;
        animation-duration: 2s;
        animation-iteration-count: infinite;
      }

      @keyframes example {
        0% {
          background-color: red;
          left: 0px;
          top: 0px;
        }
        25% {
          background-color: yellow;
          left: 30px;
          top: 0px;
        }
        50% {
          background-color: blue;
          left: 30px;
          top: 30px;
        }
        75% {
          background-color: green;
          left: 0px;
          top: 30px;
        }
        100% {
          background-color: red;
          left: 0px;
          top: 0px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item"></div>
    </div>
  </body>
</html>
