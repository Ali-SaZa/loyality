version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: loyalty-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: loyalty
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - loyalty-network

  # NestJS Application Service
  loyalty-api:
    build: .
    container_name: loyalty-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/loyalty?authSource=admin
      - PORT=3000
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=7d
    depends_on:
      - mongodb
    networks:
      - loyalty-network

volumes:
  mongodb_data:

networks:
  loyalty-network:
    driver: bridge
